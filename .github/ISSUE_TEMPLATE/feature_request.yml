name: Feature request
description: Suggest an improvement to the dock, settings, or app (for new widgets, use "Widget idea").
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How you imagine it working. Sketches or screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried, or how other dock apps handle it.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes"
        - "Maybe, with some guidance"
        - "No"
