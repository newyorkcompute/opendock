name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain choice:
# - Runner: `macos-26` (pinned rather than `macos-latest`, which currently maps
#   to the same image) is the newest GitHub-hosted macOS image and the only one
#   whose Xcodes ship the macOS 26 SDK the `#available(macOS 26, *)` Liquid
#   Glass code compiles against. "Select Xcode" picks the newest stable Xcode
#   on it (26.6 at the time of writing) for the SDK; set XCODE_VERSION to pin.
# - Compiler: the selected Xcode's own, so CI builds exactly what a contributor
#   on stock Xcode does. Both jobs compile with `-O`, which keeps the Swift 6.3.3
#   crash worked around in `DockHostingView` from coming back unnoticed.
env:
  XCODE_VERSION: ""

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # build-app.sh derives the bundle build number from the commit count.
          fetch-depth: 0

      - name: Select Xcode
        id: xcode
        run: ./.github/scripts/select-xcode.sh

      # swift-format ships with Xcode 16 and later, so there's nothing to install.
      - name: swift format lint
        run: make lint

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          # Build products are only reusable with the exact same Xcode (compiler + SDK).
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'App/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

      - name: Assemble app bundle
        run: |
          # build-app.sh tolerates `swift build` failures and only checks that
          # the binary exists, so drop any copy restored from the cache.
          rm -f "$(swift build -c release --show-bin-path)/OpenDock"
          scripts/build-app.sh

      - name: Verify app bundle
        run: |
          APP=build/OpenDock.app
          test -x "$APP/Contents/MacOS/OpenDock"
          test -f "$APP/Contents/Frameworks/libOpenDockNowPlayingHelper.dylib"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          scripts/verify-archs.sh "$APP/Contents/MacOS/OpenDock" arm64 x86_64

  universal:
    name: Universal release build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Build arm64 + x86_64
        run: swift build -c release --arch arm64 --arch x86_64 --product OpenDock

      - name: Verify architectures
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/OpenDock"
          scripts/verify-archs.sh "$BIN" arm64 x86_64
          # The check must also be able to fail.
          if scripts/verify-archs.sh "$BIN" arm64 x86_64 arm64e 2>/dev/null; then
            echo "::error::verify-archs.sh accepted a missing architecture"; exit 1
          fi
