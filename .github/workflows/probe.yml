name: probe (temporary)

on:
  push:
    branches: [cursor/stock-xcode-release-build-a47a]

permissions:
  contents: read

jobs:
  repro:
    name: Minimal repro
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh
      - name: Repro
        run: bash .github/probe/repro.sh
