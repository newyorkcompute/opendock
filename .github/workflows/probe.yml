name: probe
on:
  push:
    branches-ignore: [main]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-26-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          xcode-select -p
          swift --version
