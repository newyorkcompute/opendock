name: probe
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers; uname -m
          ls -d /Applications/Xcode*.app
          xcode-select -p
          swift --version
