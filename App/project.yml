# XcodeGen spec for the contributor-facing Xcode project. `make xcodeproj` turns it into
# App/OpenDock.xcodeproj, which is git-ignored.
#
# SwiftPM stays the source of truth. The app target here compiles only App/OpenDock (the
# `@main` module) and links everything else from ../Package.swift through the
# `OpenDockModules` product, so module settings, dependencies, and tests are read from the
# package and never duplicated. The settings below mirror what the package gives the two
# targets this project builds itself (`uiSettings` for the app, `baseSettings` for the
# helper); keep them in sync when those change.
#
# Regenerate after editing this file. Sources are Xcode 16 synchronized folders, so adding or
# removing Swift files doesn't need a regeneration.

name: OpenDock

options:
  minimumXcodeGenVersion: "2.44.0"  # syncedFolder sources
  # Written as LastUpgradeCheck. Xcode offers "update to recommended settings" when this is
  # older than the Xcode opening the project, so it stays ahead of every 26.x and 27.x
  # release. Bump it when Xcode 28 ships.
  xcodeVersion: "27.9"
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en

packages:
  OpenDock:
    path: ..

fileGroups:
  - project.yml

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Package.swift: .enableUpcomingFeature("ExistentialAny")
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # scripts/xcodeproj.sh sets this from OPENDOCK_SIGN_IDENTITY (or .env.local), the same
    # variable scripts/build-app.sh uses: "-" (ad hoc) by default, or a certificate such as
    # "OpenDock Dev" to keep permissions across builds. Nothing here needs a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "${OPENDOCK_SIGN_IDENTITY}"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's recommended settings, so it doesn't offer to "update" the generated project.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OpenDock:
    type: application
    platform: macOS
    sources:
      - path: OpenDock
        type: syncedFolder
      - path: Resources/AppIcon.icns
        group: Resources
      - path: Resources/Info.plist
        group: Resources
      - path: Resources/OpenDock.entitlements
        group: Resources
        buildPhase: none
    dependencies:
      - package: OpenDock
        product: OpenDockModules
      # The Now Playing helper is run inside /usr/bin/perl, never linked by the app. Copy it
      # to Contents/Frameworks/libOpenDockNowPlayingHelper.dylib, where
      # MediaRemoteHelperProvider.locateLibrary and scripts/build-app.sh agree it lives.
      - target: OpenDockNowPlayingHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    settings:
      base:
        PRODUCT_NAME: OpenDock
        PRODUCT_BUNDLE_IDENTIFIER: com.newyorkcompute.opendock
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OpenDock.entitlements
        # Package.swift: .defaultIsolation(MainActor.self) for UI targets
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        # Expanded into Info.plist's CFBundleShortVersionString and CFBundleVersion, which
        # scripts/build-app.sh sets from OPENDOCK_VERSION and the commit count instead.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # The package's NowPlayingHelper target, named after its product here so Xcode's output is
  # libOpenDockNowPlayingHelper.dylib, the same file name SwiftPM produces.
  OpenDockNowPlayingHelper:
    type: library.dynamic
    platform: macOS
    sources:
      - path: ../Sources/NowPlayingHelper
        name: NowPlayingHelper
        type: syncedFolder
    settings:
      base:
        EXECUTABLE_PREFIX: lib
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        # Package.swift: baseSettings only, no default isolation
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

# Named "OpenDock App" because Xcode also lists the package's own "OpenDock" scheme (the bare
# executable product); this is the one to pick. ⌘U runs the package's test targets; add new
# ones here.
schemes:
  OpenDock App:
    build:
      targets:
        OpenDock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OpenDock/DockCoreTests
        - package: OpenDock/SystemServicesTests
        - package: OpenDock/WidgetTests
        - package: OpenDock/ScriptedWidgetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
